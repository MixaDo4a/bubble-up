<script>(function(){let wanted=null;const boot=()=>{const s=document.querySelector('.productCampaign');if(!s)return;if(!s.dataset.bind){s.dataset.bind='1';s.addEventListener('change',e=>{if(e.isTrusted)wanted=s.value})}if(wanted&&[...s.options].some(o=>o.value===wanted)&&s.value!==wanted){s.value=wanted;s.dispatchEvent(new Event('change'))}const m=document.querySelector('.productMenu');if(m&&wanted){fetch('/catalog-data.html?entity=menus&_='+Date.now()).then(r=>r.json()).then(rows=>{const old=m.value,items=rows.filter(x=>x.campaign_id===wanted);m.innerHTML=items.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');if(items.some(x=>x.id===old))m.value=old})}};setInterval(boot,300)})();</script>

<script>window.addEventListener('load',()=>{const b=[...document.querySelectorAll('.side button')].find(x=>x.textContent.trim()==='Продукты');b?.addEventListener('click',()=>{let n=0;const t=setInterval(async()=>{try{const a=await (await fetch('/catalog-data.html?entity=campaigns&_='+Date.now())).json(),s=document.querySelector('.productCampaign');if(s){const c=s.value;s.innerHTML=a.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');if(a.some(x=>x.id===c))s.value=c} }catch(e){} if(++n>20)clearInterval(t)},200)},true)});</script>
<script>window.addEventListener('load',()=>{const b=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()==='Продукты');b?.addEventListener('click',()=>{let n=0;const t=setInterval(async()=>{try{const a=await (await fetch('/catalog-data.html?entity=campaigns&_='+Date.now())).json(),s=document.querySelector('.productCampaign');if(s){const c=s.value;s.innerHTML=a.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');if(a.some(x=>x.id===c))s.value=c}}catch(e){}if(++n>20)clearInterval(t)},200)},true)});</script>
<script>(function(){const api=async(body)=>{const r=await fetch('/catalog-data.html',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()};window.addEventListener('load',()=>setTimeout(()=>{const b=document.querySelector('.builderMenus'),old=b?.querySelector('.addMenu');if(b&&old){const btn=old.cloneNode(true);old.replaceWith(btn);btn.addEventListener('click',async e=>{e.preventDefault();e.stopImmediatePropagation();const name=b.querySelector('.menuName')?.value.trim(),cv=(b.querySelector('.cloudCampaignSelect')||b.querySelector('select'))?.value;if(!name||!cv)return;const cs=await (await fetch('/catalog-data.html?entity=campaigns')).json(),c=cs.find(x=>x.id===cv||x.name===cv);if(!c)return;await api({entity:'menus',data:{campaign_id:c.id,name,sort_order:0}});b.querySelector('.menuName').value=''},true)}const p=document.querySelector('.productAddPanel'),po=p?.querySelector('.newProdAdd');if(p&&po){const btn=po.cloneNode(true);po.replaceWith(btn);btn.addEventListener('click',async e=>{e.preventDefault();e.stopImmediatePropagation();const box=document.querySelector('.builderProducts'),name=p.querySelector('.newProdName')?.value.trim(),price=Number(p.querySelector('.newProdPrice')?.value||0),mv=box?.querySelector('.productMenu')?.value;if(!name||!mv)return;const ms=await (await fetch('/catalog-data.html?entity=menus')).json(),m=ms.find(x=>x.id===mv||x.name===mv);if(!m)return;await api({entity:'products',data:{menu_id:m.id,name,price,sort_order:0,is_main:!!p.querySelector('.newProdMain')?.checked}});p.querySelector('.newProdName').value='';p.querySelector('.newProdPrice').value=''},true)}},9000))})();</script>
<script>window.addEventListener('load',()=>{const b=document.querySelector('.campaignCreateSave');b?.addEventListener('click',()=>setTimeout(async()=>{try{const rows=await (await fetch('/catalog-data.html?entity=campaigns&_='+Date.now())).json();document.querySelectorAll('.cloudCampaignSelect,.productCampaign').forEach(s=>{const cur=s.value;s.innerHTML=rows.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');if(rows.some(x=>x.id===cur))s.value=cur})}catch(e){}},1800),true)});</script>

<script>
window.addEventListener('load',()=>{const side=document.querySelector('.side'),main=document.querySelector('.main');if(!side||!main||side.querySelector('.addonsAdminNav'))return;const nav=document.createElement('button');nav.className='addonsAdminNav';nav.textContent='Допы к товару';side.appendChild(nav);const sec=document.createElement('section');sec.className='addonAdminPanel';sec.style.display='none';sec.innerHTML='<h2>Допы к товару</h2><div class="grid"><div><label>Название группы допов</label><input class="addonGroupName" placeholder="Например, Сиропы"><button type="button" class="createAddonGroup">Создать группу</button></div><div><label>Название допа</label><input class="addonName" placeholder="Например, Ванильный сироп"><label style="display:block;margin-top:10px">Группа</label><select class="addonGroupSelect"></select><input class="addonPrice" type="number" placeholder="Цена допа, ₽"><input class="addonImage" type="file" accept="image/*"><label class="addonMode" style="display:block;margin-top:10px">Режим выбора<select class="addonModeSelect"><option value="single">Одна порция</option><option value="multiple">Можно несколько порций</option></select></label><button type="button" class="createAddon">Создать доп</button></div></div><div class="addonAdminList"></div>';main.appendChild(sec);nav.addEventListener('click',()=>{document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));nav.classList.add('active');main.querySelectorAll(':scope>section,:scope>.wrap').forEach(x=>x.style.display='none');sec.style.display='block';main.querySelector('.topline h1').textContent='Допы к товару';main.querySelector('.topline .save')?.style.setProperty('display','none','important')});});
</script>
