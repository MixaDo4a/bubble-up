<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#241923"><title>KRMBl Cookies · Корзина</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#241923;color:#fff;font:16px Arial,sans-serif}.cart-shell{width:min(100%,620px);min-height:100dvh;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(160deg,#3a2838,#241923 42%)}header{display:flex;align-items:center;gap:16px;margin-bottom:24px}header a{color:#fff;text-decoration:none;font-size:24px}h1{font-size:26px;margin:0;font-weight:650}.test-note{border:1px solid #efb2c366;background:#633b5328;border-radius:16px;padding:13px 15px;color:#ffddeb;font-size:14px;line-height:1.4;margin-bottom:18px}.items{display:grid;gap:12px}.cart-item{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:20px;background:#ffffff0d}.cart-photo{width:76px;height:76px;border-radius:14px;background:#ffffff12;display:grid;place-items:center;font-size:34px;overflow:hidden}.cart-photo img{width:100%;height:100%;object-fit:cover}.cart-name{font-weight:650}.cart-extra{color:#d8c4d1;font-size:13px;margin-top:5px}.cart-price{font-weight:650;white-space:nowrap}.quantity{display:flex;align-items:center;gap:11px;margin-top:10px}.quantity button,.remove{color:#fff;background:#ffffff17;border:0;border-radius:9px;min-width:30px;height:30px}.remove{color:#f0b1cb}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:22px 2px}.pay{width:100%;padding:17px;border:0;border-radius:18px;background:#e86f99;color:#281b24;font-size:17px;font-weight:700}.pay:disabled{opacity:.55}.empty{text-align:center;padding:60px 16px;color:#ddcfda}.empty-menu,.login-link{display:inline-block;margin-top:18px;color:#ffd7e4}.empty-menu{border:0;background:transparent;font:inherit;text-decoration:underline;cursor:pointer}.status{min-height:26px;margin-top:14px;color:#ffd5e2;line-height:1.4}.modal{position:fixed;inset:0;z-index:10;background:#120d14b8;display:none;align-items:flex-end;justify-content:center;padding:16px}.modal.open{display:flex}.sheet{width:min(100%,580px);border-radius:26px;background:#372838;padding:24px;box-shadow:0 20px 70px #0008}.sheet h2{margin:0 0 10px}.sheet p{color:#e3d3dd;line-height:1.5}.sheet .pay{margin-top:8px}.sheet .cancel{width:100%;margin-top:12px;border:0;background:transparent;color:#efcddb;padding:12px;font-size:15px}
</style></head><body><main class="cart-shell"><header><a href="/index.html" aria-label="Назад" data-return-home>‹</a><h1>Корзина</h1></header><div class="test-note">🧪 Сейчас оплата только тестовая: деньги не списываются, крошки попадут в отдельный тестовый баланс.</div><section class="items" aria-live="polite"></section><div class="summary" hidden><div class="total"><span>Итого</span><span class="total-value">0 ₽</span></div><button class="pay open-payment">Оплатить по СБП</button></div><div class="status" role="status"></div><section class="modal" aria-modal="true" role="dialog"><div class="sheet"><h2>Оплата по СБП</h2><p>Подключение банка пока не выполнено. Нажмите кнопку ниже, чтобы безопасно проверить тестовый путь заказа. Реального списания не будет.</p><button class="pay simulate">Симулировать успешную оплату</button><button class="cancel">Вернуться в корзину</button></div></section></main>
<script>
(()=>{
const KEY='krmbl.cart.v1',AUTH='krmbl.auth.session',itemsEl=document.querySelector('.items'),summary=document.querySelector('.summary'),totalEl=document.querySelector('.total-value'),status=document.querySelector('.status'),modal=document.querySelector('.modal'),testNote=document.querySelector('.test-note');let orderInFlight=false;
const returnHome=event=>{event.preventDefault();event.stopPropagation();if(event.target instanceof Element&&event.target.closest('[data-force-home]')){location.assign('/index.html');return}if(window.parent!==window){window.parent.postMessage({type:'krmbl-close-product-flow'},location.origin);window.setTimeout(()=>{if(location.pathname==='/cart.html')location.assign('/index.html')},300);return}let origin='';try{origin=sessionStorage.getItem('krmbl.catalog-return')||'';sessionStorage.removeItem('krmbl.catalog-return')}catch{}let referrer;try{referrer=new URL(document.referrer||location.href,location.href)}catch{referrer=new URL(location.href)}const sameOrigin=referrer.origin===location.origin;const fromProduct=sameOrigin&&/^\/(?:legacy\/)?product-options\.html$/.test(referrer.pathname);if(fromProduct&&history.length>2){history.go(-2);return}if(sameOrigin&&/^\/(?:legacy\/)?index\.html$/.test(referrer.pathname)){history.back();return}if(origin&&sameOrigin){history.back();return}location.assign('/index.html')};
document.addEventListener('click',event=>{const target=event.target instanceof Element?event.target.closest('[data-return-home]'):null;if(target)returnHome(event)},true);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getCart=()=>{try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}};
const save=a=>localStorage.setItem(KEY,JSON.stringify(a));
const token=()=>{try{const x=JSON.parse(localStorage.getItem(AUTH)||'null');return x?.access_token||x?.accessToken||''}catch{return''}};
const total=cart=>cart.reduce((sum,row)=>sum+(Number(row.price)+Number(row.addonTotal||0))*Number(row.quantity||1),0);
const render=()=>{const cart=getCart();if(!cart.length){itemsEl.innerHTML='<div class="empty">В корзине пока пусто.<br><button type="button" class="empty-menu" data-return-home data-force-home>Перейти в меню</button></div>';summary.hidden=true;return}itemsEl.innerHTML=cart.map((row,i)=>'<article class="cart-item"><div class="cart-photo">'+(row.image?'<img src="'+esc(row.image)+'" alt="">':'🍪')+'</div><div><div class="cart-name">'+esc(row.name)+'</div><div class="cart-extra">'+(row.addonNames?.length?'Добавки: '+esc(row.addonNames.join(', ')):'Без добавок')+'</div><div class="quantity"><button type="button" data-action="dec" data-i="'+i+'" aria-label="Уменьшить">−</button><span>'+Number(row.quantity||1)+'</span><button type="button" data-action="inc" data-i="'+i+'" aria-label="Увеличить">+</button><button class="remove" type="button" data-action="remove" data-i="'+i+'">Удалить</button></div></div><div class="cart-price">'+((Number(row.price)+Number(row.addonTotal||0))*Number(row.quantity||1)).toLocaleString('ru-RU')+' ₽</div></article>').join('');summary.hidden=false;totalEl.textContent=total(cart).toLocaleString('ru-RU')+' ₽'};
itemsEl.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const cart=getCart(),i=Number(b.dataset.i),row=cart[i];if(!row)return;if(b.dataset.action==='inc')row.quantity=Math.min(99,row.quantity+1);if(b.dataset.action==='dec')row.quantity=Math.max(1,row.quantity-1);if(b.dataset.action==='remove')cart.splice(i,1);save(cart);render()});
document.querySelector('.open-payment').addEventListener('click',async()=>{status.textContent='';if(!token()){status.innerHTML='Для заказа войдите в профиль. <a class="login-link" href="/index.html?auth=1">Открыть профиль и войти</a>';return}const availability=await fetch('/api/orders/test-payment',{cache:'no-store'}).then(r=>r.json()).catch(()=>({enabled:false}));if(!availability.enabled){status.textContent='Тестовая оплата включена только в локальном режиме разработчика.';return}modal.classList.add('open')});
document.querySelector('.cancel').addEventListener('click',()=>modal.classList.remove('open'));modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
document.querySelector('.simulate').addEventListener('click',async e=>{if(orderInFlight)return;const cart=getCart();if(!cart.length)return;orderInFlight=true;e.currentTarget.disabled=true;status.textContent='Создаём заказ и проверяем тестовую оплату…';try{const auth={Authorization:'Bearer '+token(),'Content-Type':'application/json'};const create=await fetch('/api/orders',{method:'POST',headers:auth,body:JSON.stringify({items:cart.map(row=>({productId:row.productId,quantity:row.quantity,selectedAddonIds:row.addonIds||[]}))})});const order=await create.json();if(!create.ok)throw Error(order.error||'Не удалось оформить заказ');const payment=await fetch('/api/orders/test-payment',{method:'POST',headers:auth,body:JSON.stringify({orderId:order.id})});const result=await payment.json();if(!payment.ok)throw Error(result.error||'Тестовая оплата не завершилась');save([]);render();modal.classList.remove('open');testNote.textContent='✅ Тестовая покупка проведена. Деньги не списаны; начисление записано отдельно и не меняет реальные крошки.';status.textContent='Заказ принят. Начислено тестовых крошек: '+Number(result.crumbsEarned||0)+' 🍪';}catch(err){status.textContent=err instanceof Error?err.message:'Не удалось завершить тестовую покупку'}finally{orderInFlight=false;e.currentTarget.disabled=false}});
render();
})();
</script></body></html>
